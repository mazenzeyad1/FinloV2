<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Finlo — Design Mockup</title>
<style>
  :root{
    --ink:#0F172A; --ink-2:#334155; --muted:#64748B; --faint:#94A3B8;
    --bg:#F6F8FA; --card:#FFFFFF; --line:#E8EDF2; --line-2:#EEF2F6;
    --brand:#0E9F6E; --brand-600:#0B8A5F; --brand-700:#097552; --mint:#E9FBF3; --mint-2:#D6F6E8;
    --pos:#0E9F6E; --neg:#E0524B; --amber:#F4A93C; --indigo:#6366F1; --teal:#14B8A6; --violet:#8B5CF6; --rose:#F472B6;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
    --shadow-lg:0 10px 40px rgba(16,24,40,.12);
    --r:18px; --r-sm:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #EAF7F1 0%, rgba(234,247,241,0) 60%),
      radial-gradient(900px 500px at -10% 10%, #EEF2FB 0%, rgba(238,242,251,0) 55%),
      var(--bg);
    color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:28px 24px 80px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:20px;letter-spacing:-.02em}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand) 0%,#13B981 100%);display:grid;place-items:center;box-shadow:0 6px 16px rgba(14,159,110,.35)}
  .logo svg{width:19px;height:19px}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;box-shadow:var(--shadow)}
  .seg button{border:0;background:transparent;font:inherit;font-weight:600;font-size:14px;color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer;transition:.15s}
  .seg button.active{background:var(--ink);color:#fff}
  .tag{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px}

  .stage{display:none}
  .stage.show{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* WEB */
  .app{display:grid;grid-template-columns:248px 1fr;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);min-height:760px}
  .side{background:linear-gradient(180deg,#0E1B2A 0%,#0C1622 100%);color:#CBD5E1;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
  .side .brand{color:#fff;font-size:18px;margin:4px 6px 18px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;color:#9FB0C3;text-decoration:none;font-weight:600;font-size:14.5px;cursor:pointer;transition:.15s}
  .nav a svg{width:19px;height:19px;opacity:.85}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.on{background:linear-gradient(135deg,var(--brand) 0%,#13B981 100%);color:#fff;box-shadow:0 8px 20px rgba(14,159,110,.35)}
  .nav a.on svg{opacity:1}
  .side .spacer{flex:1}
  .upgrade{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:15px;margin:6px}
  .upgrade h4{margin:0 0 4px;color:#fff;font-size:14px}
  .upgrade p{margin:0 0 11px;font-size:12.5px;color:#8FA1B5;line-height:1.4}
  .upgrade button{width:100%;border:0;background:#fff;color:#0E1B2A;font-weight:700;font-size:13px;padding:9px;border-radius:10px;cursor:pointer}
  .userchip{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;margin:4px 2px}
  .userchip .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
  .userchip .nm{font-size:13.5px;font-weight:600;color:#fff;line-height:1.1}
  .userchip .em{font-size:11.5px;color:#8FA1B5}

  .main{padding:26px 30px;overflow:auto}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .head h1{margin:0;font-size:26px;letter-spacing:-.02em}
  .head .sub{color:var(--muted);font-size:14px;margin-top:3px}
  .head-actions{display:flex;gap:10px;align-items:center}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}
  .btn:hover{border-color:#cdd7e1;box-shadow:var(--shadow)}
  .btn svg{width:17px;height:17px}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.green{background:linear-gradient(135deg,var(--brand),#13B981);border:0;color:#fff;box-shadow:0 8px 18px rgba(14,159,110,.32)}
  .btn.green svg{color:#fff}

  .grid{display:grid;gap:18px}
  .g-4{grid-template-columns:repeat(4,1fr)}
  .g-3{grid-template-columns:repeat(3,1fr)}
  .g-2{grid-template-columns:1fr 1fr}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
  .card.tight{padding:18px}
  .kpi .lab{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
  .kpi .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
  .kpi .ico svg{width:17px;height:17px}
  .kpi .val{font-size:27px;font-weight:750;letter-spacing:-.025em;margin:12px 0 6px}
  .kpi .delta{font-size:12.5px;font-weight:650;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px}
  .kpi .delta svg{width:12px;height:12px}
  .up{color:var(--pos);background:var(--mint)}
  .down{color:var(--neg);background:#FDECEA}
  .down svg{transform:rotate(180deg)}
  .flat{color:var(--muted);background:#F1F5F9}

  .sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sec-h h3{margin:0;font-size:16px;letter-spacing:-.01em}
  .sec-h a{font-size:13px;color:var(--brand-600);font-weight:650;text-decoration:none;cursor:pointer}

  .donutwrap{display:flex;align-items:center;gap:22px}
  .legend{display:flex;flex-direction:column;gap:11px;flex:1}
  .legend .row{display:flex;align-items:center;gap:10px;font-size:13.5px}
  .legend .dot{width:10px;height:10px;border-radius:3px;flex:none}
  .legend .nm{color:var(--ink-2);font-weight:600}
  .legend .amt{margin-left:auto;font-weight:700;color:var(--ink)}
  .legend .pct{color:var(--faint);font-size:12px;width:38px;text-align:right}

  .bud{display:flex;flex-direction:column;gap:16px}
  .bud .row .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .bud .row .nm{font-weight:650;font-size:14px;display:flex;align-items:center;gap:9px}
  .bud .row .em{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px}
  .bud .row .amt{font-size:13px;color:var(--muted);font-weight:600}
  .bar{height:9px;background:#EEF2F6;border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px}

  .txn{display:flex;flex-direction:column}
  .txn .r{display:grid;grid-template-columns:40px 1fr auto auto;gap:14px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line-2)}
  .txn .r:last-child{border-bottom:0}
  .txn .av{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
  .txn .nm{font-weight:650;font-size:14px}
  .txn .mt{font-size:12px;color:var(--faint);margin-top:2px}
  .txn .cat{font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .txn .amt{font-weight:700;font-size:14.5px;text-align:right;font-variant-numeric:tabular-nums}
  .amt.neg{color:var(--ink)} .amt.pos{color:var(--pos)}

  .pill{font-size:12px;font-weight:650;padding:5px 11px;border-radius:999px;background:var(--mint);color:var(--brand-700);white-space:nowrap}

  /* MOBILE */
  .phones{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
  .phone{width:332px;flex:none}
  .phone .cap{text-align:center;font-size:13px;color:var(--muted);font-weight:650;margin-bottom:14px}
  .device{position:relative;background:#0E1B2A;border-radius:46px;padding:13px;box-shadow:0 30px 60px rgba(16,24,40,.18),0 6px 16px rgba(16,24,40,.1)}
  .screen{position:relative;background:#F6F8FA;border-radius:34px;overflow:hidden;height:680px;display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:128px;height:28px;background:#0E1B2A;border-radius:0 0 18px 18px;z-index:30}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 6px;font-size:12.5px;font-weight:650;color:var(--ink)}
  .m-scroll{flex:1;overflow:auto;padding:6px 16px 12px}
  .m-scroll::-webkit-scrollbar{display:none}
  .m-top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 16px}
  .m-top .hi{font-size:13px;color:var(--muted)} .m-top .nm{font-size:19px;font-weight:750;letter-spacing:-.02em}
  .m-top .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:grid;place-items:center;color:#fff;font-weight:700}
  .balcard{background:linear-gradient(135deg,#0E1B2A 0%,#123A2E 130%);border-radius:24px;padding:22px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 30px rgba(14,27,42,.28)}
  .balcard::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(19,185,129,.5),transparent 70%)}
  .balcard .lab{font-size:12.5px;color:#9FB7C9;font-weight:600;position:relative}
  .balcard .big{font-size:34px;font-weight:780;letter-spacing:-.03em;margin:8px 0 12px;position:relative}
  .balcard .chips{display:flex;gap:10px;position:relative}
  .balcard .chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 12px;flex:1}
  .balcard .chip .t{font-size:11px;color:#9FB7C9}
  .balcard .chip .v{font-size:14px;font-weight:700;margin-top:2px}
  .qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
  .qa .q{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
  .qa .qi{width:52px;height:52px;border-radius:16px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}
  .qa .qi svg{width:21px;height:21px;color:var(--brand-600)}
  .qa .qt{font-size:11.5px;font-weight:600;color:var(--ink-2)}
  .m-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .m-sec{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
  .m-sec h4{margin:0;font-size:15px}.m-sec a{font-size:12.5px;color:var(--brand-600);font-weight:650;text-decoration:none}
  .m-txn{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .m-txn:last-child{border:0}
  .m-txn .av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
  .m-txn .nm{font-weight:650;font-size:13.5px}.m-txn .mt{font-size:11.5px;color:var(--faint);margin-top:1px}
  .m-txn .amt{margin-left:auto;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
  .tabbar{display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 8px 22px}
  .tabbar .t{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);cursor:pointer;font-size:10.5px;font-weight:600}
  .tabbar .t svg{width:23px;height:23px}
  .tabbar .t.on{color:var(--brand-600)}
  .fab{position:absolute;bottom:78px;right:18px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#13B981);display:grid;place-items:center;box-shadow:0 12px 24px rgba(14,159,110,.45);z-index:20;cursor:pointer}
  .fab svg{width:25px;height:25px;color:#fff}

  .note{max-width:760px;margin:26px auto 0;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.55}
  .footer{margin-top:30px;text-align:center;color:var(--faint);font-size:12.5px}
  @media(max-width:980px){.app{grid-template-columns:1fr}.side{display:none}.g-4{grid-template-columns:1fr 1fr}.g-3{grid-template-columns:1fr}.g-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 14.5 10 9.5l3.5 3.5L19 7.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="19" cy="7.5" r="1.6" fill="#fff"/></svg></span>
      Finlo
      <span class="tag" style="margin-left:8px">Design Concept</span>
    </div>
    <div class="seg" role="tablist">
      <button id="t-web" class="active" onclick="show('web')">Web app</button>
      <button id="t-mob" onclick="show('mob')">Mobile app</button>
    </div>
    <span class="tag">Modern fintech · clean &amp; trustworthy</span>
  </div>

  <section id="web" class="stage show"></section>
  <section id="mob" class="stage"></section>

  <div class="footer">Finlo design concept — palette, type and components documented in <b>finlo-design-system.md</b>. Use the toggle above to switch between Web and Mobile.</div>
</div>

<script>
/* ---------- icon set (Heroicons-style, stroke) ---------- */
const ICONS = {
  home:'M3 11.5 12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9',
  card:'M3 7h18a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1ZM2 10h20M6 14h4',
  list:'M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01',
  budget:'M12 3a9 9 0 1 0 9 9h-9V3Z M13 3.05A9 9 0 0 1 20.95 11H13V3.05Z',
  goal:'M12 21V12m0 0 6-3.5V4l-6 3.5M12 12 6 8.5V4l6 3.5M12 7.5 18 4M12 7.5 6 4',
  swap:'M7 7h11l-3-3M17 17H6l3 3',
  chart:'M4 19V5m0 14h16M8 16v-5m4 5V8m4 8v-7',
  wallet:'M3 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Zm13 4h3M16 12a1 1 0 1 0 2 0 1 1 0 0 0-2 0Z',
  in:'M12 4v12m0 0 4-4m-4 4-4-4M5 20h14',
  out:'M12 20V8m0 0 4 4m-4-4-4 4M5 4h14',
  save:'M5 4h11l3 3v13H5V4Zm3 0v6h8M9 16h6',
  filter:'M4 5h16l-6 7v5l-4 2v-7L4 5Z',
  plus:'M12 5v14M5 12h14',
  arrowup:'M12 19V5m0 0-6 6m6-6 6 6',
  signal:'M2 18h3v3H2zM8 13h3v8H8zM14 9h3v12h-3zM20 4h3v17h-3z',
  back:'M15 5l-7 7 7 7',
  dots:'M5 12h.01M12 12h.01M19 12h.01',
};
function ic(name,color){return `<svg viewBox="0 0 24 24" fill="none" stroke="${color||'currentColor'}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">`+
  ICONS[name].split('M').filter(Boolean).map(d=>`<path d="M${d}"/>`).join('')+`</svg>`;}

/* ---------- donut chart ---------- */
function donut(size){
  size=size||150; const r=size/2-16, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const segs=[['var(--brand)',37],['var(--indigo)',20],['var(--teal)',13],['var(--amber)',12],['#CBD5E1',18]];
  let off=0; let arcs='';
  segs.forEach(([col,pct])=>{const len=C*pct/100;arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len-3} ${C-len+3}" stroke-dashoffset="${-off}" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len;});
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">Spent</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="${size>120?19:16}" fill="var(--ink)" font-weight="750">$3,180</text></svg>`;
}
/* ---------- cash-flow grouped bars ---------- */
function cashflow(){
  const months=['Jan','Feb','Mar','Apr','May','Jun'];
  const inc=[5.4,5.8,6.0,6.1,6.1,6.24], spd=[3.6,4.1,3.2,3.7,2.9,3.18];
  const W=520,H=180,pad=24,bw=18,gap=10,groupW=(W-pad*2)/months.length,max=7;
  let bars='',labels='';
  months.forEach((m,i)=>{
    const gx=pad+i*groupW+groupW/2;
    const hi=inc[i]/max*(H-40), hs=spd[i]/max*(H-40);
    bars+=`<rect x="${gx-bw-gap/2}" y="${H-20-hi}" width="${bw}" height="${hi}" rx="5" fill="var(--brand)"/>`;
    bars+=`<rect x="${gx+gap/2}" y="${H-20-hs}" width="${bw}" height="${hs}" rx="5" fill="#CBD5E1"/>`;
    labels+=`<text x="${gx}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--faint)">${m}</text>`;
  });
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <line x1="${pad}" y1="${H-20}" x2="${W-pad}" y2="${H-20}" stroke="var(--line)"/>${bars}${labels}</svg>`;
}
function legend(nm,col,amt,pct){return `<div class="row"><span class="dot" style="background:${col}"></span><span class="nm">${nm}</span><span class="amt">${amt}</span><span class="pct">${pct}</span></div>`;}
function mlegend(nm,col,amt){return `<div style="display:flex;align-items:center;gap:10px;font-size:13px"><span style="width:9px;height:9px;border-radius:3px;background:${col}"></span><span style="font-weight:600;color:var(--ink-2)">${nm}</span><span style="margin-left:auto;font-weight:700">${amt}</span></div>`;}
function budget(em,nm,embg,amt,col,pct){const over=pct>100;return `<div class="row"><div class="top"><span class="nm"><span class="em" style="background:${embg}">${em}</span>${nm}</span><span class="amt"${over?' style="color:var(--neg)"':''}>${amt}</span></div><div class="bar"><i style="width:${Math.min(pct,100)}%;background:${over?'var(--neg)':col}"></i></div></div>`;}
function txn(in_,nm,avbg,meta,cat,catbg,catcol,amt,sign){return `<div class="r"><span class="av" style="background:${avbg}">${in_}</span><div><div class="nm">${nm}</div><div class="mt">${meta}</div></div><span class="cat" style="background:${catbg};color:${catcol}">${cat}</span><span class="amt ${sign}">${amt}</span></div>`;}
function mtxn(in_,nm,avbg,meta,amt,amtcol){return `<div class="m-txn"><span class="av" style="background:${avbg}">${in_}</span><div><div class="nm">${nm}</div><div class="mt">${meta}</div></div><span class="amt" style="color:${amtcol}">${amt}</span></div>`;}
function ringSmall(pct,col){const r=20,c=2*Math.PI*r,off=c*(1-pct/100);return `<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="#EEF2F6" stroke-width="6"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 26 26)"/><text x="26" y="30" text-anchor="middle" font-size="12" font-weight="750" fill="var(--ink)">${pct}%</text></svg>`;}
function ringBig(pct){const r=46,c=2*Math.PI*r,off=c*(1-pct/100);return `<svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="#13B981" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-size="26" font-weight="780" fill="#fff">${pct}%</text></svg>`;}
function goalCard(nm,em,cur,tgt,pct,col){return `<div class="card tight" style="display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:center;gap:12px"><div style="width:42px;height:42px;border-radius:12px;background:var(--mint);display:grid;place-items:center;font-size:20px">${em}</div><div><div style="font-weight:700;font-size:15px">${nm}</div><div style="font-size:12.5px;color:var(--muted)">${cur} of ${tgt}</div></div></div>
  <div class="bar"><i style="width:${pct}%;background:${col}"></i></div>
  <div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="pill">${pct}% there</span><span style="color:var(--muted);font-weight:600">$${(parseInt(tgt.replace(/[^0-9]/g,''))-parseInt(cur.replace(/[^0-9]/g,''))).toLocaleString()} to go</span></div></div>`;}

/* ---------- interactions ---------- */
function show(id){
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  document.getElementById('t-web').classList.toggle('active',id==='web');
  document.getElementById('t-mob').classList.toggle('active',id==='mob');
  window.scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('on'));a.classList.add('on');}));
document.querySelectorAll('.tabbar').forEach(tb=>tb.querySelectorAll('.t').forEach(t=>t.addEventListener('click',()=>{tb.querySelectorAll('.t').forEach(x=>x.classList.remove('on'));t.classList.add('on');})));
</script>
